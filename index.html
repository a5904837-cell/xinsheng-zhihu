<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新生智護｜收新病人教學</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#31445a;background:#f4f8fc}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding:18px 18px 40px}header{background:linear-gradient(125deg,#d9f3f5,#fce5ed);border-radius:24px;padding:22px;text-align:center}h1{font-size:27px;margin:4px}h2{font-size:21px}p{line-height:1.7}.muted{color:#69798a;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}.tabs button{background:#eef5f9;color:#435d70}.tabs button.active{background:#3d849c;color:white}button{border:0;border-radius:13px;padding:13px 12px;font-size:15px;font-weight:650;cursor:pointer;background:#3d849c;color:white}button:disabled{opacity:.45}.card{border:1px solid #e0e9ef;border-radius:20px;padding:18px;margin:13px 0;background:white}.scene{background:#eef9fa;border-radius:20px;text-align:center;padding:20px 12px;min-height:180px}.art{font-size:65px}.bubble{display:inline-block;background:white;border-radius:18px;padding:11px 16px;max-width:95%;line-height:1.6}.choices{display:grid;gap:9px}.choices button{text-align:left;background:#edf5f8;color:#344a60;font-weight:500}.choices button:focus{outline:3px solid #72b7ca}.good{background:#e9f8ef;border-left:4px solid #36a46d;padding:12px;border-radius:9px}.warn{background:#fff3e8;border-left:4px solid #e7a24e;padding:12px;border-radius:9px}.hidden{display:none}.step{font-size:13px;color:#577c90}.pill{display:inline-block;background:#e9f1fa;border-radius:99px;padding:5px 11px;font-size:12px;margin:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}select,textarea{width:100%;border:1px solid #c9d7e0;border-radius:12px;padding:12px;font:inherit;margin:8px 0}textarea{min-height:90px}ul{padding-left:22px;line-height:1.8}.progress{height:8px;background:#e7edf2;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#5ba9b9;transition:width .3s}footer{margin-top:20px;text-align:center;color:#708091;font-size:12px}a{color:#267d99}</style></head><body><main class="app"><header><div style="font-size:40px">👩🏻‍⚕️ 🍼 🐣</div><h1>新生智護</h1><div>新生兒收治・動畫與互動教學</div><p class="muted">第一版示範｜急診轉入・新生兒黃疸｜虛構個案</p></header><div class="tabs"><button id="tabA" class="active" onclick="tab('A')">🎬 動畫</button><button id="tabB" onclick="tab('B')">🎮 闖關</button><button id="tabD" onclick="tab('D')">🤖 助手</button></div><section id="A"><h2>🎬 A｜Q版情境動畫</h2><p class="muted">以逐幕角色動畫方式呈現流程，可點擊下一幕，無須下載影片。</p><div class="progress"><div id="ap" style="width:20%"></div></div><div class="card"><div class="step" id="as"></div><div class="scene"><div class="art" id="emoji">👩🏻‍⚕️☎️</div><div class="bubble" id="dialog"></div></div><h3 id="at"></h3><p id="desc"></p><div class="actions"><button onclick="move(-1)">上一幕</button><button onclick="move(1)">下一幕</button><button onclick="tab('B')">開始闖關</button></div></div></section><section id="B" class="hidden"><h2>🎮 B｜收治闖關</h2><p class="muted">五關選擇題，即時回饋。答錯可再試，不作為正式能力認證。</p><div class="progress"><div id="bp" style="width:0%"></div></div><div class="card"><div class="step" id="qs"></div><h3 id="qt"></h3><div class="choices" id="choices"></div><div id="feedback" style="margin-top:12px"></div><div class="actions"><button id="next" class="hidden" onclick="nextQ()">下一關 →</button><button onclick="restart()">重新開始</button></div></div></section><section id="D" class="hidden"><h2>🤖 D｜智慧收治助手</h2><div class="warn">此為規則式示範原型，尚未串接生成式AI。僅使用虛構資料，不輸入病人個資；所有處置依醫囑及院內核准SOP執行。</div><div class="card"><label for="origin">病人來源</label><select id="origin"><option>急診</option><option>產房</option><option>3樓開刀房</option><option>其他／待確認</option></select><label for="birth">出生方式</label><select id="birth"><option>未提供</option><option>自然產</option><option>剖腹產</option></select><label for="isolation">隔離狀態</label><select id="isolation"><option>尚未確認</option><option>已由權責人員確認，依院內規範辦理</option></select><button onclick="generate()">產生收治學習清單</button><div id="result"></div></div></section><footer>教學原型 v1.0｜非臨床決策系統｜正式使用前請由單位主管與臨床教師審核</footer></main><script>let ai=0,qi=0,correct=0,locked=false;const scenes=[['👩🏻‍⚕️☎️','急診通知：有一位新生兒黃疸個案準備轉入。','接獲通知','先確認身分、來源、病況、隔離需求與缺漏資訊，不自行決定床位。'],['🛏️🌡️','先確認收治安排，再依單位規範準備病床設備。','病床與設備','已知規則：病床備加溫處理台，開啟體重計及烤燈；設備操作安全及適用情境仍需院內確認。'],['👶🏻📋','病人到達！請依規範完成身分核對與護理評估。','入院評估','確認身分、交接資料、生命徵象及重要觀察項目；不可填入未取得的病人數據。'],['⚖️📏','出生方式與來源不同，測量規則也不同喔。','特殊測量規則','已知單位規則：自然產不須磅重；剖腹產需磅重；3樓開刀房出生的新生兒要量身高。實施前仍須確認適用條件。'],['👩🏻‍⚕️📝','交班完成前，先確認缺漏與待確認醫囑。','SBAR交班','依已知資料撰寫SBAR；黃疸相關檢驗、照光適應症與治療設定均須依醫囑與院內SOP。']];function renderA(){let s=scenes[ai];document.getElementById('as').textContent=`第 ${ai+1} 幕／共 ${scenes.length} 幕`;document.getElementById('emoji').textContent=s[0];document.getElementById('dialog').textContent=s[1];document.getElementById('at').textContent=s[2];document.getElementById('desc').textContent=s[3];document.getElementById('ap').style.width=((ai+1)/scenes.length*100)+'%'}function move(n){ai=(ai+n+scenes.length)%scenes.length;renderA()}function tab(t){for(let x of ['A','B','D']){document.getElementById(x).classList.toggle('hidden',x!==t);document.getElementById('tab'+x).classList.toggle('active',x===t)}}const questions=[['接獲急診收治通知，隔離狀態未知，第一步？',['直接安排一般床位','確認收治資訊、隔離需求與權責安排','先開始照光治療'],1,'尚未確認隔離與醫囑時，不能自行安排床位或開始治療。'],['依已知單位規則，病床準備包含？',['加溫處理台、開啟體重計與烤燈','只需備棉被','直接設定照光參數'],0,'設備須依單位規範與安全檢核準備，治療設定另依醫囑。'],['已知單位規則中，哪個敘述正確？',['自然產均須磅重','剖腹產需磅重','所有新生兒一律不量身高'],1,'自然產不須磅重、剖腹產需磅重；3樓開刀房出生須量身高。'],['新生兒黃疸病人尚無照光醫囑，應？',['自行決定照光','依黃疸外觀直接調參數','確認醫囑與院內核准照護規範'],2,'不得以教學原型取代醫囑、醫療判斷或院內SOP。'],['交班時資料缺漏，最適當做法？',['自行填寫推測值','標示待確認並向權責人員查證','略過不提'],1,'交班需明確區分已知資訊、未確認資訊與待確認醫囑。']];function renderQ(){let q=questions[qi];document.getElementById('qs').textContent=`第 ${qi+1} 關／共 ${questions.length} 關・答對 ${correct} 題`;document.getElementById('qt').textContent=q[0];document.getElementById('choices').innerHTML='';q[1].forEach((a,i)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+a;b.onclick=()=>answer(i);document.getElementById('choices').appendChild(b)});document.getElementById('feedback').innerHTML='';document.getElementById('next').classList.add('hidden');document.getElementById('bp').style.width=(qi/questions.length*100)+'%';locked=false}function answer(i){if(locked)return;let q=questions[qi],ok=i===q[2];document.getElementById('feedback').innerHTML=`<div class="${ok?'good':'warn'}">${ok?'✅ 答對！':'💡 再試一次：'} ${q[3]}</div>`;if(ok){locked=true;correct++;document.getElementById('next').classList.remove('hidden')}}function nextQ(){qi++;if(qi>=questions.length){document.getElementById('qs').textContent='完成！';document.getElementById('qt').textContent='🎉 五關完成';document.getElementById('choices').innerHTML='';document.getElementById('feedback').innerHTML='<div class="good">已完成本次練習。請由臨床教師進行床邊實作評核。</div>';document.getElementById('next').classList.add('hidden');document.getElementById('bp').style.width='100%'}else renderQ()}function restart(){qi=0;correct=0;renderQ()}function generate(){let o=document.getElementById('origin').value,b=document.getElementById('birth').value,iso=document.getElementById('isolation').value;let measurements=b==='剖腹產'?'依已知規則需磅重':b==='自然產'?'依已知規則不須磅重':'出生方式未提供，磅重需求待確認';let height=o==='3樓開刀房'?'依已知規則需量身高':'是否需量身高：依來源及院內規範確認';let text=`<h3>📋 收治前準備</h3><ul><li>確認病人身分、來源（${o}）、交接與收治安排</li><li>病床準備：加溫處理台、開啟體重計及烤燈（依院內安全規範）</li><li>隔離：${iso}；不得自行判定</li><li>測量：${measurements}；${height}</li></ul><h3>🩺 入院評估</h3><ul><li>依核准流程核對身分、交接資料、生命徵象與黃疸相關資訊</li><li>確認檢驗資料及醫囑，不自行啟動照光或設定參數</li></ul><h3>⚠️ 待確認</h3><ul><li>床位與隔離安排、黃疸檢驗結果、照光醫囑及院內SOP</li><li>監測、量測與設備設定的適用條件</li></ul><h3>📝 SBAR練習草稿</h3><p><b>S：</b>急診轉入新生兒黃疸個案，實際身分及病況待交接確認。<br><b>B：</b>出生方式：${b}；來源：${o}。<br><b>A：</b>生命徵象、黃疸相關評估及檢驗資料待確認。<br><b>R：</b>請確認隔離、收治安排及醫囑，依院內流程完成後續照護。</p>`;document.getElementById('result').innerHTML=text}renderA();renderQ();</script></body></html>
